<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products – Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <!-- Navbar (same as index) -->
    <header>
    <div class="navbar">
      <div class="nav-logo border">
        <div class="logo"></div>
      </div>
      <div class="nav-address border">
        <p class="add-first">Deliver to</p>
        <div class="add-icon">
          <i class="fa-solid fa-location-dot"></i>
          <p class="add-sec">India</p>
        </div>
      </div>
      <div class="nav-search">
        <select class="search-select"><option> All </option></select>
        <input placeholder="Search Amazon" class="search-input">
        <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
      </div>
      <div class="nav-country">
        <select class="cnt-box"><option>EN</option></select>
      </div>
      <div class="nav-signin border">
        <p><span>Hello, sign in</span></p>
        <select class="nav-sec"><option>Account & Lists</option></select>
      </div>
      <div class="nav-return border">
        <p><span>Returns</span></p>
        <p class="nav-sec">& Orders</p>
      </div>
      <div class="nav-cart border" id="cart-btn">
        <div class="cart-icon-wrap">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge" id="cart-badge">0</span>
        </div>
        Cart
      </div>
    </div>
    <div class="panel">
      <div class="panel-all border"><i class="fa-solid fa-bars"></i> All</div>
      <div class="panel-ops">
        <p class="border">Today's Deals</p>
        <p class="border">Customer Service</p>
        <p class="border">Registry</p>
        <p class="border">Gift Cards</p>
        <p class="border">Sell</p>
      </div>
      <div class="panel-deals border">Shop deals in Electronics</div>
    </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="index.html">← Back to Home</a>
      <span id="breadcrumb-category"></span>
    </div>

    <!-- Page title -->
    <div class="product-page-header">
      <h1 id="page-title">Products</h1>
      <p id="page-subtitle"></p>
    </div>

    <!-- Product grid -->
    <div class="product-grid" id="product-grid"></div>

    <!-- Cart Overlay -->
    <div id="cart-overlay"></div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar">
      <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button class="cart-close-btn" id="cart-close">✕</button>
      </div>
      <div id="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Total:</span>
          <span id="cart-total">₹0</span>
        </div>
        <button class="checkout-btn">Proceed to Checkout</button>
        <button class="continue-btn" id="continue-shopping">Continue Shopping</button>
      </div>
    </div>

    <div id="toast"></div>
    <script src="script.js"></script>
    <script src="product.js"></script>
</body>
</html>
